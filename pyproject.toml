[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvcontrol"
version = "0.2.2"
description = "NV//CONTROL — NVIDIA control center for CachyOS / Arch Linux (KDE Plasma, Wayland & X11)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PySide6>=6.6", "nvidia-ml-py>=12.535"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nvcontrol = "nvcontrol.app:main"

[tool.setuptools.packages.find]
include = ["nvcontrol*"]

[tool.setuptools.package-data]
"nvcontrol.ui" = ["*.svg", "fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
